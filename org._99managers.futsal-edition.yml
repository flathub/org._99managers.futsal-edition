        url: https://codeberg.org/dulvui/99managers-futsal-edition/raw/commit/973c3d606cf241840857dff334e8a520db44405a/flatpak/org._99managers.futsal-edition.appdata.xml
        sha256: 1ffdd01e605112d5b03cb918ada8d8bdbdeb1e8b98f5f45b05937399b589676f
