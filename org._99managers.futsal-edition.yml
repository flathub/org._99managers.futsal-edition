app-id: org._99managers.futsal-edition
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
base: org.godotengine.godot.BaseApp
base-version: '4.7'
command: godot-runner
finish-args:
  - --share=ipc
  - --socket=x11 # <-- Godot needs X11
  - --socket=pulseaudio
  - --device=dri
    # to load and save data packs and save games
  - --filesystem=xdg-documents
modules:
  - name: 99 Managers Futsal Edition
    buildsystem: simple
    build-commands:
      # The game itself
      - install 99managers-futsal-edition-linux.pck /app/bin/godot-runner.pck
      # Metadata and a .desktop file
      - install -D org._99managers.futsal-edition.desktop /app/share/applications/org._99managers.futsal-edition.desktop
      - install -D org._99managers.futsal-edition.appdata.xml /app/share/metainfo/org._99managers.futsal-edition.metainfo.xml
      # Icons
      - install -D icon-256.png /app/share/icons/hicolor/256x256/apps/org._99managers.futsal-edition.png
    sources:
      # The game is pulled from GitHub
      - type: archive
        strip-components: 0
        url: https://codeberg.org/dulvui/99managers-futsal-edition/releases/download/v0.9.0/99managers-futsal-edition-linux.zip
        sha256: 572b1ee04ca139547a36e4dc7de20223ccd86e3eda3664c661e083aa0ac45921
      - type: file
        url: https://codeberg.org/dulvui/99managers-futsal-edition/raw/commit/b22946a4c2e3a0e0fa44dfc7c3915577b50331a6/flatpak/org._99managers.futsal-edition.appdata.xml
        sha256: 7ddc4b1b804859ad090cd8ff9484d002a043f458e411bf38f80df6bdc3bb33a1
      - type: file
        url: https://codeberg.org/dulvui/99managers-futsal-edition/raw/commit/f35c9c9045da9faa3300f7635cc4ec34e3f168c3/flatpak/org._99managers.futsal-edition.desktop
        sha256: b7e3d43e462f9155b2c2a88d873017d309884f3a07456a7aa394766f446fb85c
      - type: file
        url: https://codeberg.org/dulvui/99managers-futsal-edition/raw/commit/7c2ba2d92c76b0f70751dbc0187d7af59c7ae4a9/flatpak/icon-256.png
